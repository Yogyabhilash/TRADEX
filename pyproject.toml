[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradex"
version = "0.2.0"
description = "TRADEX: Autonomous Multi-Agent LLM Financial Trading Framework & Quant Research Harness"
authors = [{ name = "Sai Yogyabhilash", email = "saiyogyabhilash06bramhanapalli@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=2.2.6",
    "yfinance>=0.2.40",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
    "anthropic>=0.40",
]

[project.scripts]
tradinglab = "tradinglab.cli:main"
tradex = "tradinglab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
app = ["streamlit>=1.30", "plotly>=5.18"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
